<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
  <meta name="theme-color" content="#f7ece9">
  <meta name="og:title" content="给小婷的回忆录">
  <meta name="og:description" content="从第一句话，到第一次见面。">
  <link rel="icon" href="data:,">
  <title>给小婷的回忆录</title>
  <style>
    :root {
      --paper: #fffaf6;
      --paper-deep: #f5e5e3;
      --ink: #382d31;
      --muted: #78686c;
      --rose: #a84e65;
      --rose-deep: #743446;
      --rose-soft: #eed4d9;
      --sage: #56796f;
      --line: rgba(88, 58, 68, .14);
      --shadow: 0 22px 70px rgba(89, 51, 60, .12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100svh;
      padding: 58px 0 92px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 3%, #f8dde2 0, transparent 27rem),
        radial-gradient(circle at 92% 22%, #f2e3d2 0, transparent 28rem),
        linear-gradient(180deg, #fbf3ef, #fffaf6 52%, #f5ebe7);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .bookbar {
      position: fixed;
      z-index: 30;
      top: 0;
      left: 0;
      right: auto;
      width: 100%;
      height: 54px;
      padding: 0 max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      background: rgba(255, 250, 246, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .bookbar-title {
      min-width: 0;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 16px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toc-btn {
      min-height: 34px;
      border: 1px solid rgba(168, 78, 101, .25);
      border-radius: 999px;
      padding: 5px 12px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      cursor: pointer;
    }
    .music-btn {
      min-height: 34px;
      border: 1px solid rgba(86, 121, 111, .28);
      border-radius: 999px;
      padding: 5px 12px;
      color: #35594f;
      background: rgba(226, 238, 232, .66);
      cursor: pointer;
      white-space: nowrap;
    }
    .progress {
      position: fixed;
      z-index: 31;
      top: 53px;
      left: 0;
      right: auto;
      width: 100%;
      height: 2px;
      background: rgba(168, 78, 101, .08);
    }
    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--rose), #c88591);
      transition: width .3s ease;
    }
    main { width: min(820px, calc(100% - 26px)); margin: 0 auto; }
    .page-card {
      position: relative;
      min-height: calc(100svh - 178px);
      padding: clamp(24px, 6vw, 52px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .88), rgba(255, 249, 245, .82)),
        var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: pageIn .42s ease both;
    }
    .page-card:before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(168, 78, 101, .08);
      border-radius: 19px;
      pointer-events: none;
    }
    .page-card > * { position: relative; z-index: 1; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .chapter {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .46);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2 {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-weight: 550;
      line-height: 1.25;
      letter-spacing: -.025em;
    }
    h1 { margin: 18px 0 24px; font-size: clamp(46px, 12vw, 76px); }
    h2 { margin: 6px 0 22px; font-size: clamp(30px, 7vw, 44px); }
    h3 { margin: 24px 0 8px; font-size: 19px; }
    p { margin: 0 0 1.05em; }
    .lead { color: var(--muted); font-size: clamp(17px, 3.8vw, 20px); line-height: 1.8; }
    .small { color: var(--muted); font-size: 13px; }
    .quote {
      margin: 20px 0;
      padding: 17px 19px;
      border-left: 3px solid var(--rose);
      border-radius: 0 16px 16px 0;
      color: var(--rose-deep);
      background: rgba(255, 250, 247, .8);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 19px;
      line-height: 1.7;
    }
    .quote small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 11px;
      font-style: normal;
      letter-spacing: .04em;
    }
    .quote-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .quote-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255, 255, 255, .62);
    }
    .quote-card time { display: block; color: var(--rose); font-size: 11px; font-weight: 750; margin-bottom: 7px; }
    .quote-card p { margin: 0; font-size: 15px; line-height: 1.72; }
    .bubble {
      width: fit-content;
      max-width: 100%;
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 14px;
    }
    .bubble.them { background: #f1e5e4; color: #49373d; border-top-left-radius: 4px; }
    .bubble.me { margin-left: auto; background: #e2eee8; color: #27443b; border-top-right-radius: 4px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin: 20px 0;
    }
    .stat {
      min-height: 102px;
      padding: 14px 12px;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .58);
    }
    .stat strong {
      display: block;
      margin-bottom: 5px;
      color: var(--rose-deep);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 25px;
      line-height: 1.15;
    }
    .stat span { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .call-table {
      width: 100%;
      margin: 18px 0 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 17px;
      background: rgba(255, 255, 255, .58);
      font-size: 13px;
    }
    .call-table th,
    .call-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    .call-table tr:last-child th,
    .call-table tr:last-child td { border-bottom: 0; }
    .call-table th { color: var(--muted); font-weight: 550; }
    .call-table td { color: var(--rose-deep); font-weight: 750; text-align: right; }
    .timeline {
      position: relative;
      display: grid;
      gap: 15px;
      margin-top: 20px;
      padding-left: 23px;
    }
    .timeline:before {
      content: "";
      position: absolute;
      left: 5px;
      top: 6px;
      bottom: 5px;
      width: 1px;
      background: var(--rose-soft);
    }
    .timeline-item { position: relative; padding-left: 12px; }
    .timeline-item:before {
      content: "";
      position: absolute;
      left: -20px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 4px rgba(238, 212, 217, .5);
    }
    .timeline-item time { color: var(--rose); font-size: 11px; font-weight: 750; }
    .timeline-item h3 { margin: 3px 0 3px; font-size: 16px; }
    .timeline-item p { margin: 0; color: var(--muted); font-size: 14px; }
    .memory-list { display: grid; gap: 11px; margin-top: 17px; }
    .memory-item {
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .54);
    }
    .memory-item strong { color: var(--rose-deep); }
    .memory-item p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 18px 0 0; }
    .tags span {
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      font-size: 12px;
    }
    .chat-shot {
      display: block;
      width: min(100%, 390px);
      margin: 22px auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #f4f3f2;
      box-shadow: 0 12px 34px rgba(70, 47, 55, .13);
    }
    .chat-shot img { display: block; width: 100%; height: auto; }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 20px 0;
    }
    .photo-card {
      margin: 0;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .6);
    }
    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      background: #f2eeeb;
    }
    .photo-card figcaption {
      padding: 8px 10px 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .photo-wide img { height: auto; max-height: none; object-fit: contain; }
    .photo-card.photo-full img {
      height: auto;
      max-height: none;
      object-fit: contain;
      background: #101728;
    }
    .chapter-page .photo-grid { width: min(100%, 560px); margin: 24px auto 4px; }
    .toc-list { display: grid; gap: 8px; margin-top: 12px; }
    .toc-tools {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }
    .toc-search {
      width: 100%;
      min-height: 44px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, .72);
      font: inherit;
      outline: none;
    }
    .toc-search:focus {
      border-color: rgba(168, 78, 101, .48);
      box-shadow: 0 0 0 3px rgba(238, 212, 217, .35);
    }
    .toc-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .toc-action {
      min-height: 34px;
      padding: 5px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .3);
      cursor: pointer;
    }
    .toc-action.active { color: #fff; background: var(--rose-deep); border-color: transparent; }
    .toc-group-title {
      margin: 16px 0 2px;
      color: var(--rose);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    .toc-row { display: grid; grid-template-columns: 1fr 38px; gap: 6px; align-items: stretch; }
    .toc-item {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, .56);
      text-align: left;
      cursor: pointer;
    }
    .toc-item b { color: var(--rose); font-size: 12px; }
    .toc-item span { display: block; font-size: 14px; line-height: 1.45; }
    .toc-item small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .toc-star {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--muted);
      background: rgba(255, 255, 255, .55);
      cursor: pointer;
    }
    .toc-star.saved { color: var(--rose-deep); background: var(--rose-soft); }
    .toc-empty { padding: 22px 12px; color: var(--muted); text-align: center; }
    .secret-combo {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 20px;
    }
    .secret-combo button {
      min-height: 48px;
      border: 1px solid rgba(168, 78, 101, .24);
      border-radius: 16px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      font-weight: 700;
      cursor: pointer;
    }
    .secret-reply {
      min-height: 48px;
      margin-top: 10px;
      padding: 12px 15px;
      border-radius: 15px;
      color: var(--muted);
      background: rgba(255,255,255,.6);
      border: 1px solid var(--line);
    }
    .page-card.reply-pulse .secret-reply {
      animation: replyPulse .5s ease;
    }
    @keyframes replyPulse {
      0% { transform: scale(.97); background: rgba(238, 212, 217, .35); }
      60% { transform: scale(1.02); background: rgba(238, 212, 217, .62); }
      100% { transform: scale(1); }
    }
    .tutorial-steps {
      display: grid;
      gap: 9px;
      margin: 20px 0 14px;
    }
    .tutorial-step {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 11px;
      align-items: start;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, .55);
    }
    .tutorial-step b {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      background: var(--rose);
      font-size: 12px;
    }
    .tutorial-step span { color: var(--muted); font-size: 14px; line-height: 1.55; }
    .tutorial-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 4px 0 18px;
    }
    .tutorial-go,
    .tutorial-secondary,
    .voice-action,
    .game-next,
    .reply-generate,
    .reply-copy,
    .reply-share,
    .reply-close {
      min-height: 44px;
      border: 1px solid rgba(168, 78, 101, .28);
      border-radius: 999px;
      padding: 8px 16px;
      color: #fff;
      background: var(--rose-deep);
      font-weight: 700;
      cursor: pointer;
    }
    .tutorial-go { margin-top: 3px; }
    .tutorial-secondary {
      color: var(--rose-deep);
      background: rgba(255, 255, 255, .72);
    }
    .voice-wall {
      display: grid;
      gap: 11px;
      margin: 20px 0 16px;
    }
    .voice-note {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 12px;
      align-items: center;
      margin: 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, .62);
    }
    .voice-bubble {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 48px;
      border-radius: 16px 16px 16px 5px;
      color: #fff;
      background: linear-gradient(135deg, #9c5268, #b97380);
      font-size: 12px;
      font-weight: 750;
    }
    .voice-bubble:after {
      content: "▶";
      display: block;
      margin-top: 2px;
      font-size: 10px;
      opacity: .8;
    }
    .voice-note figcaption { min-width: 0; }
    .voice-note strong {
      display: block;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.55;
    }
    .voice-note time {
      display: block;
      margin: 3px 0 6px;
      color: var(--muted);
      font-size: 11px;
    }
    .voice-note audio {
      display: block;
      width: 100%;
      height: 34px;
      accent-color: var(--rose);
    }
    .voice-note.is-playing {
      border-color: rgba(168, 78, 101, .45);
      box-shadow: 0 0 0 3px rgba(238, 212, 217, .35);
    }
    .memory-game {
      margin-top: 18px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0, rgba(238, 212, 217, .62), transparent 13rem),
        rgba(255, 255, 255, .62);
    }
    .game-meter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .game-meter b { color: var(--rose-deep); }
    .game-progress {
      flex: 1;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(168, 78, 101, .12);
    }
    .game-progress span {
      display: block;
      width: 20%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--rose), #cb8c9a);
      transition: width .25s ease;
    }
    .memory-game h3 { margin: 15px 0 12px; font-size: 18px; line-height: 1.6; }
    .game-options { display: grid; gap: 8px; }
    .game-option {
      width: 100%;
      min-height: 46px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, .72);
      text-align: left;
      cursor: pointer;
    }
    .game-option:hover { border-color: rgba(168, 78, 101, .4); }
    .game-option.correct {
      color: #2f584d;
      border-color: rgba(86, 121, 111, .45);
      background: #e4efe9;
    }
    .game-option.wrong {
      color: #8b3e50;
      border-color: rgba(168, 78, 101, .4);
      background: #f5e1e4;
    }
    .game-option:disabled { cursor: default; opacity: .78; }
    .game-reveal {
      margin-top: 11px;
      padding: 12px 14px;
      border-radius: 14px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      font-size: 14px;
      line-height: 1.65;
    }
    .game-reveal[hidden],
    .game-next[hidden],
    .reply-result[hidden],
    .reply-error[hidden] { display: none; }
    .game-next { margin-top: 12px; }
    .game-finish {
      margin: 13px 0 0;
      color: var(--rose-deep);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 20px;
      line-height: 1.55;
    }
    .reply-composer {
      margin-top: 18px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .6);
    }
    .reply-label {
      display: block;
      margin-bottom: 7px;
      color: var(--rose-deep);
      font-size: 13px;
      font-weight: 750;
    }
    .reply-textarea {
      display: block;
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      background: rgba(255, 255, 255, .78);
      font: inherit;
      font-size: 15px;
      line-height: 1.65;
      outline: none;
    }
    .reply-textarea:focus {
      border-color: rgba(168, 78, 101, .52);
      box-shadow: 0 0 0 3px rgba(238, 212, 217, .34);
    }
    .reply-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0 12px;
    }
    .reply-chip {
      min-height: 34px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .26);
      font-size: 12px;
      cursor: pointer;
    }
    .reply-chip.active { color: #fff; background: var(--rose-deep); border-color: transparent; }
    .reply-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 0 12px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .reply-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .reply-copy,
    .reply-share {
      color: var(--rose-deep);
      background: rgba(255, 255, 255, .72);
    }
    .reply-result { margin-top: 14px; }
    .reply-card {
      padding: 16px;
      border: 1px dashed rgba(168, 78, 101, .34);
      border-radius: 18px;
      background:
        linear-gradient(160deg, rgba(255, 250, 246, .95), rgba(245, 229, 227, .72));
    }
    .reply-card small { display: block; color: var(--rose-deep); font-size: 11px; letter-spacing: .08em; }
    .reply-card blockquote {
      margin: 10px 0;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 18px;
      line-height: 1.72;
      white-space: pre-wrap;
    }
    .reply-card time { color: var(--muted); font-size: 11px; }
    .reply-error {
      margin: 8px 0 0;
      color: #8b3e50;
      font-size: 13px;
    }
    .reply-inbox {
      position: fixed;
      z-index: 90;
      inset: 0;
      display: none;
      place-items: center;

    const encodeReply = (payload) => {
      const bytes = new TextEncoder().encode(JSON.stringify(payload));
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    };

    const decodeReply = (value) => {
      try {
        const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      } catch {
        return null;
      }
    };

    function setupMemoryGame(game) {
      const step = game.querySelector("[data-game-step]");
      const progress = game.querySelector("[data-game-progress]");
      const question = game.querySelector("[data-game-question]");
      const options = game.querySelector("[data-game-options]");
      const reveal = game.querySelector("[data-game-reveal]");
      const next = game.querySelector("[data-game-next]");
      let questionIndex = 0;
      let score = 0;

      const drawQuestion = () => {
        const current = memoryQuestions[questionIndex];
        step.textContent = `第 ${questionIndex + 1} / ${memoryQuestions.length} 题`;
        progress.style.width = `${((questionIndex + 1) / memoryQuestions.length) * 100}%`;
        question.textContent = current.question;
        options.replaceChildren();
        reveal.hidden = true;
        reveal.textContent = "";
        next.hidden = true;
        next.textContent = questionIndex === memoryQuestions.length - 1 ? "看看我们的结果" : "下一题";

        current.options.forEach((label, optionIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "game-option";
          button.textContent = label;
          button.addEventListener("click", () => {
            const correct = optionIndex === current.answer;
            if (correct) score += 1;
            [...options.children].forEach((option, index) => {
              option.disabled = true;
              if (index === current.answer) option.classList.add("correct");
            });
            if (!correct) button.classList.add("wrong");
            reveal.innerHTML = `<strong>${correct ? "答对了。" : "没关系，我把原话留给你。"}</strong><br>${current.reveal}<br><small>${current.source}</small>`;
            reveal.hidden = false;
            next.hidden = false;
          });
          options.appendChild(button);
        });
      };

      const finishGame = () => {
        game.querySelector(".game-meter").hidden = true;
        question.textContent = "四道题翻完了";
        options.replaceChildren();
        reveal.hidden = true;
        next.hidden = true;
        const finish = document.createElement("p");
        finish.className = "game-finish";
        finish.textContent = score === memoryQuestions.length
          ? "你全记得。原来不是只有我一个人，把我们的日子收得这么仔细。"
          : `你答对了 ${score} 道。分数不重要，你刚刚翻回来的每一句话，都是我们真的说过的。`;
        const again = document.createElement("button");
        again.type = "button";
        again.className = "game-next";
        again.textContent = "再玩一次";
        again.addEventListener("click", () => {
          questionIndex = 0;
          score = 0;
          game.querySelector(".game-meter").hidden = false;
          finish.remove();
          again.remove();
          drawQuestion();
        });
        game.append(finish, again);
      };

      next.addEventListener("click", () => {
        if (questionIndex === memoryQuestions.length - 1) {
          finishGame();
          return;
        }
        questionIndex += 1;
        drawQuestion();
      });
      drawQuestion();
    }

      try {

        if (savedDraft && !textarea.value) textarea.value = savedDraft;
      } catch {}

      const updateCount = () => {
        count.textContent = `${textarea.value.length} / 240`;
        try {
          localStorage.setItem("memoirReplyDraft", textarea.value);
        } catch {}
      };

      const renderReply = () => {
        const text = textarea.value.trim();
        if (text.length < 2) {
          error.textContent = "至少留两个字给我吧。";
          error.hidden = false;
          result.hidden = true;
          return;
        }
        error.hidden = true;
        const now = new Date();
        const payload = { text, at: now.toISOString() };
        const url = new URL(location.href);
        const replyPage = pages.findIndex((page) => page.title === "这一页，一起写完");
        url.search = "";
        url.hash = `page=${replyPage + 1}`;
        url.searchParams.set("reply", encodeReply(payload));
        generatedReplyUrl = url.href;
        preview.textContent = text;
        date.textContent = new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(now);
        result.hidden = false;
        showToast("回信链接已经生成");
      };

      textarea.addEventListener("input", updateCount);
      chips.forEach((chip) => {
        chip.addEventListener("click", () => {
          const sentence = chip.dataset.replyChip || "";
          const current = textarea.value.trim();
          if (current.includes(sentence)) {
            textarea.value = current
              .replace(sentence, "")
              .replace(/\n{2,}/g, "\n")
              .trim();
            chip.classList.remove("active");
          } else {
            textarea.value = current ? `${current}\n${sentence}` : sentence;
            chip.classList.add("active");
          }
          updateCount();
          textarea.focus();
        });
      });
      generate.addEventListener("click", renderReply);
      copy.addEventListener("click", async () => {
        if (!generatedReplyUrl) return;
        showToast(await copyText(generatedReplyUrl) ? "已复制，发给圣杰就好" : "复制失败，请长按链接复制");
      });
      share.addEventListener("click", async () => {
        if (!generatedReplyUrl) return;
        if (navigator.share) {
          try {
            await navigator.share({
              title: "给小婷的回忆录 · 回信",
              text: "我在回忆录里给你留了一句话。",
              url: generatedReplyUrl
            });
            return;
          } catch {}
        }
        showToast(await copyText(generatedReplyUrl) ? "链接已复制，发给圣杰就好" : "复制失败，请长按复制");
      });
      updateCount();
    }

      }
      currentPage = Math.min(Math.max(index, 0), pages.length - 1);
      const page = pages[currentPage];
      pageCard.className = `page-card${page.type ? ` ${page.type}` : ""}`;
      pageCard.style.animation = "none";
      pageCard.offsetHeight;
      pageCard.style.animation = "";
      pageCard.innerHTML = `
        ${page.chapter ? `<div class="chapter">${page.chapter}</div>` : ""}
        ${page.type === "title" ? "" : `<h2>${page.title}</h2>`}
        ${page.html}
      `;
      surfaceLeadImage();
      applyLightReading(currentPage);
      pageCounter.textContent = `${currentPage + 1} / ${pages.length}`;
      pageChapter.textContent = page.chapter || "给小婷的回忆录";
      prevButton.disabled = currentPage === 0;
      nextButton.disabled = currentPage === pages.length - 1;
      progressBar.style.width = `${((currentPage + 1) / pages.length) * 100}%`;
      document.title = `${page.title} · 给小婷的回忆录`;
      if (updateHash) history.replaceState(null, "", `#page=${currentPage + 1}`);
      try {
        localStorage.setItem("memoirLastPage", String(currentPage + 1));
      } catch {}
      const saved = bookmarks.has(currentPage);
      bookmarkButton.textContent = saved ? "★" : "☆";
      bookmarkButton.classList.toggle("saved", saved);
      bookmarkButton.setAttribute("aria-pressed", String(saved));
      bookmarkButton.setAttribute("aria-label", saved ? "取消收藏当前页" : "收藏当前页");
      let comboIndex = 0;
      const comboOrder = ["call", "like", "mua"];
      pageCard.querySelectorAll("[data-secret-reply]").forEach((button) => {
        button.addEventListener("click", () => {
          const reply = document.getElementById("secretReply");
          const combo = button.closest("[data-combo]");
          if (!combo) return;
          if (button.dataset.comboKey === comboOrder[comboIndex]) {
            comboIndex += 1;
            if (reply) {
              reply.textContent = comboIndex === comboOrder.length
                ? "三连收到。老公在，喜欢也收到了，最后那声 mua 我替你留着。"
                : button.dataset.secretReply || "";
            }
          } else {
            comboIndex = 0;
            if (reply) reply.textContent = "顺序是：老公 → 我喜欢你 → mua。再试一次。";
          }
          pageCard.classList.remove("reply-pulse");
          pageCard.offsetHeight;
          pageCard.classList.add("reply-pulse");
        });
      });
      wirePageInteractions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function buildToc() {
      tocList.innerHTML = "";
      const keyword = tocSearch.value.trim().toLocaleLowerCase("zh-CN");
      savedFilter.textContent = `${onlyShowSaved ? "★" : "☆"} 只看收藏 (${bookmarks.size})`;
      interactionFilter.textContent = "✦ 只看互动";
      let currentGroup = "";
      let visibleCount = 0;
      pages.forEach((page, index) => {
        if (page.type === "chapter-page") return;
        const summary = pageSummary(page);
        const searchText = `${page.title} ${page.chapter || ""} ${summary}`.toLocaleLowerCase("zh-CN");
        if (keyword && !searchText.includes(keyword) && !isSubsequenceMatch(keyword, searchText)) return;
        if (onlyShowSaved && !bookmarks.has(index)) return;
        if (onlyShowInteractive && !page.interaction) return;
        const group = page.chapter || "开篇";
        if (group !== currentGroup) {
          const title = document.createElement("div");
          title.className = "toc-group-title";
          title.textContent = group;
          tocList.appendChild(title);
          currentGroup = group;
        }
        const row = document.createElement("div");
        row.className = "toc-row";
        const item = document.createElement("button");
        item.type = "button";
        item.className = "toc-item";
        item.innerHTML = `<b>${String(index + 1).padStart(2, "0")}</b><span>${page.title}${page.interaction ? ` <i class="toc-badge">互动</i>` : ""}<small>${summary}</small></span>`;
        item.addEventListener("click", () => {
          tocOverlay.classList.remove("open");
          renderPage(index);
        });
        const star = document.createElement("button");
        star.type = "button";
        star.className = `toc-star${bookmarks.has(index) ? " saved" : ""}`;
        star.textContent = bookmarks.has(index) ? "★" : "☆";
        star.setAttribute("aria-label", bookmarks.has(index) ? "取消收藏" : "收藏");
        star.addEventListener("click", () => {
          if (bookmarks.has(index)) bookmarks.delete(index);
          else bookmarks.add(index);
          saveBookmarks();
          if (currentPage === index) {
            const saved = bookmarks.has(index);
            bookmarkButton.textContent = saved ? "★" : "☆";
            bookmarkButton.classList.toggle("saved", saved);
          }
          buildToc();
          showToast(bookmarks.has(index) ? "这一页已经收藏好了" : "已取消收藏");
        });
        row.append(item, star);
        tocList.appendChild(row);
        visibleCount += 1;
      });
      if (!visibleCount) {
        const empty = document.createElement("div");
        empty.className = "toc-empty";
        empty.textContent = onlyShowSaved
          ? "还没有收藏的页面。翻到喜欢的页，点一下“☆”。"
          : onlyShowInteractive
            ? "互动页暂时没有找到，先把关键词清空试试。"
            : "没有找到，换个关键词试试。";
        tocList.appendChild(empty);
      }
    }

    prevButton.addEventListener("click", () => renderPage(currentPage - 1));
    nextButton.addEventListener("click", () => renderPage(currentPage + 1));
    tocButton.addEventListener("click", () => {
      resumeButton.hidden = currentPage === 0;
      buildToc();
      tocOverlay.classList.add("open");
    });
    tocClose.addEventListener("click", () => tocOverlay.classList.remove("open"));
    tocSearch.addEventListener("input", buildToc);
    resumeButton.addEventListener("click", () => {
      tocOverlay.classList.remove("open");
      renderPage(0);
    });
    savedFilter.addEventListener("click", () => {
      onlyShowSaved = !onlyShowSaved;
      if (onlyShowSaved) {
        onlyShowInteractive = false;
        interactionFilter.classList.remove("active");
      }
      savedFilter.classList.toggle("active", onlyShowSaved);
      savedFilter.textContent = onlyShowSaved ? "★ 只看收藏" : "☆ 只看收藏";
      buildToc();
    });
    interactionFilter.addEventListener("click", () => {
      onlyShowInteractive = !onlyShowInteractive;
      if (onlyShowInteractive) {
        onlyShowSaved = false;
        savedFilter.classList.remove("active");
      }
      interactionFilter.classList.toggle("active", onlyShowInteractive);
      buildToc();
    });
    bookmarkButton.addEventListener("click", () => {
      if (bookmarks.has(currentPage)) bookmarks.delete(currentPage);
      else bookmarks.add(currentPage);
      saveBookmarks();
      renderPage(currentPage, false);
      showToast(bookmarks.has(currentPage) ? "这一页已经收藏好了" : "已取消收藏");
    });
    tocOverlay.addEventListener("click", (event) => {
      if (event.target === tocOverlay) tocOverlay.classList.remove("open");
    });
    const closeReplyInbox = () => {
      replyInbox.classList.remove("open");
      document.body.style.overflow = "";
    };
    replyInboxClose.addEventListener("click", closeReplyInbox);
    replyInbox.addEventListener("click", (event) => {
      if (event.target === replyInbox) closeReplyInbox();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") renderPage(currentPage - 1);
      if (event.key === "ArrowRight") renderPage(currentPage + 1);
      if (event.key === "Escape") {
        tocOverlay.classList.remove("open");
        closeReplyInbox();
      }
    });
    document.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        renderPage(currentPage + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });
    window.addEventListener("hashchange", () => renderPage(readHashPage(), false));

    buildToc();
    renderPage(readHashPage(), false);
    const incomingReply = new URL(location.href).searchParams.get("reply");
    if (incomingReply) showReplyInbox(decodeReply(incomingReply));
    playMusic();
  </script>
</body>
</html>
