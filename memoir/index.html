<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
  <meta name="theme-color" content="#f7ece9">
  <meta name="og:title" content="给小婷的回忆录">
  <meta name="og:description" content="从第一句话，到第一次见面。">
  <link rel="icon" href="data:,">
  <title>给小婷的回忆录</title>
  <style>
    :root {
      --paper: #fffaf6;
      --paper-deep: #f5e5e3;
      --ink: #382d31;
      --muted: #78686c;
      --rose: #a84e65;
      --rose-deep: #743446;
      --rose-soft: #eed4d9;
      --sage: #56796f;
      --line: rgba(88, 58, 68, .14);
      --shadow: 0 22px 70px rgba(89, 51, 60, .12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100svh;
      padding: 58px 0 92px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 3%, #f8dde2 0, transparent 27rem),
        radial-gradient(circle at 92% 22%, #f2e3d2 0, transparent 28rem),
        linear-gradient(180deg, #fbf3ef, #fffaf6 52%, #f5ebe7);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .bookbar {
      position: fixed;
      z-index: 30;
      top: 0;
      left: 0;
      right: auto;
      width: 100%;
      height: 54px;
      padding: 0 max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      background: rgba(255, 250, 246, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .bookbar-title {
      min-width: 0;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 16px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toc-btn {
      min-height: 34px;
      border: 1px solid rgba(168, 78, 101, .25);
      border-radius: 999px;
      padding: 5px 12px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      cursor: pointer;
    }
    .progress {
      position: fixed;
      z-index: 31;
      top: 53px;
      left: 0;
      right: auto;
      width: 100%;
      height: 2px;
      background: rgba(168, 78, 101, .08);
    }
    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--rose), #c88591);
      transition: width .3s ease;
    }
    main { width: min(820px, calc(100% - 26px)); margin: 0 auto; }
    .page-card {
      position: relative;
      min-height: calc(100svh - 178px);
      padding: clamp(24px, 6vw, 52px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .88), rgba(255, 249, 245, .82)),
        var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: pageIn .42s ease both;
    }
    .page-card:before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(168, 78, 101, .08);
      border-radius: 19px;
      pointer-events: none;
    }
    .page-card > * { position: relative; z-index: 1; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .chapter {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .46);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2 {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-weight: 550;
      line-height: 1.25;
      letter-spacing: -.025em;
    }
    h1 { margin: 18px 0 24px; font-size: clamp(46px, 12vw, 76px); }
    h2 { margin: 6px 0 22px; font-size: clamp(30px, 7vw, 44px); }
    h3 { margin: 24px 0 8px; font-size: 19px; }
    p { margin: 0 0 1.05em; }
    .lead { color: var(--muted); font-size: clamp(17px, 3.8vw, 20px); line-height: 1.8; }
    .small { color: var(--muted); font-size: 13px; }
    .quote {
      margin: 20px 0;
      padding: 17px 19px;
      border-left: 3px solid var(--rose);
      border-radius: 0 16px 16px 0;
      color: var(--rose-deep);
      background: rgba(255, 250, 247, .8);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 19px;
      line-height: 1.7;
    }
    .quote small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 11px;
      font-style: normal;
      letter-spacing: .04em;
    }
    .quote-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .quote-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255, 255, 255, .62);
    }
    .quote-card time { display: block; color: var(--rose); font-size: 11px; font-weight: 750; margin-bottom: 7px; }
    .quote-card p { margin: 0; font-size: 15px; line-height: 1.72; }
    .bubble {
      width: fit-content;
      max-width: 100%;
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 14px;
    }
    .bubble.them { background: #f1e5e4; color: #49373d; border-top-left-radius: 4px; }
    .bubble.me { margin-left: auto; background: #e2eee8; color: #27443b; border-top-right-radius: 4px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin: 20px 0;
    }
    .stat {
      min-height: 102px;
      padding: 14px 12px;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .58);
    }
    .stat strong {
      display: block;
      margin-bottom: 5px;
      color: var(--rose-deep);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 25px;
      line-height: 1.15;
    }
    .stat span { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .timeline {
      position: relative;
      display: grid;
      gap: 15px;
      margin-top: 20px;
      padding-left: 23px;
    }
    .timeline:before {
      content: "";
      position: absolute;
      left: 5px;
      top: 6px;
      bottom: 5px;
      width: 1px;
      background: var(--rose-soft);
    }
    .timeline-item { position: relative; padding-left: 12px; }
    .timeline-item:before {
      content: "";
      position: absolute;
      left: -20px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 4px rgba(238, 212, 217, .5);
    }
    .timeline-item time { color: var(--rose); font-size: 11px; font-weight: 750; }
    .timeline-item h3 { margin: 3px 0 3px; font-size: 16px; }
    .timeline-item p { margin: 0; color: var(--muted); font-size: 14px; }
    .memory-list { display: grid; gap: 11px; margin-top: 17px; }
    .memory-item {
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .54);
    }
    .memory-item strong { color: var(--rose-deep); }
    .memory-item p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 18px 0 0; }
    .tags span {
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      font-size: 12px;
    }
    .chat-shot {
      display: block;
      width: min(100%, 390px);
      margin: 22px auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #f4f3f2;
      box-shadow: 0 12px 34px rgba(70, 47, 55, .13);
    }
    .chat-shot img { display: block; width: 100%; height: auto; }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 20px 0;
    }
    .photo-card {
      margin: 0;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .6);
    }
    .photo-card img {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .photo-card figcaption {
      padding: 8px 10px 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .photo-wide img { height: auto; max-height: 430px; object-fit: cover; }
    .chapter-page .photo-grid { width: min(100%, 560px); margin: 24px auto 4px; }
    .chapter-page .photo-card img { height: 150px; }
    .toc-list { display: grid; gap: 8px; margin-top: 20px; }
    .toc-item {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, .56);
      text-align: left;
      cursor: pointer;
    }
    .toc-item b { color: var(--rose); font-size: 12px; }
    .toc-item span { font-size: 14px; line-height: 1.45; }
    .title-page { display: flex; flex-direction: column; justify-content: center; }
    .title-page .date { color: var(--rose); font-size: 13px; font-weight: 750; letter-spacing: .18em; }
    .title-page h1 { margin-top: 22px; }
    .chapter-page { display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .chapter-page .chapter { align-self: center; }
    .chapter-page p { color: var(--muted); }
    .end-page { display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .end-page h1 { font-size: clamp(36px, 9vw, 58px); }
    .page-nav {
      position: fixed;
      z-index: 32;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(520px, calc(100% - 24px));
      min-height: 56px;
      display: grid;
      grid-template-columns: 92px 1fr 92px;
      gap: 8px;
      align-items: center;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      color: #fff;
      background: rgba(54, 41, 46, .9);
      box-shadow: 0 12px 34px rgba(0,0,0,.18);
      backdrop-filter: blur(16px);
    }
    .page-nav button {
      min-height: 40px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(255,255,255,.11);
      cursor: pointer;
    }
    .page-nav button:disabled { opacity: .3; cursor: default; }
    .page-indicator { text-align: center; font-size: 12px; line-height: 1.3; }
    .page-indicator b { display: block; font-size: 14px; }
    .toc-overlay {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: none;
      padding: 70px 14px 90px;
      background: rgba(42, 30, 35, .42);
      backdrop-filter: blur(8px);
    }
    .toc-overlay.open { display: block; }
    .toc-panel {
      width: min(680px, 100%);
      max-height: calc(100svh - 160px);
      margin: 0 auto;
      overflow: auto;
      padding: 22px;
      border-radius: 24px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .toc-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .toc-head h2 { margin: 0; font-size: 27px; }
    .toc-close {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      cursor: pointer;
    }
    .toc-list { max-height: none; }
    @media (max-width: 620px) {
      body { padding-top: 52px; padding-bottom: 82px; font-size: 16px; line-height: 1.8; }
      .bookbar { height: 50px; }
      .progress { top: 49px; }
      main { width: calc(100% - 20px); }
      .page-card { min-height: calc(100svh - 158px); padding: 22px 17px 28px; border-radius: 22px; }
      .page-card:before { inset: 10px; border-radius: 16px; }
      h2 { font-size: 29px; }
      h1 { font-size: 45px; }
      .quote-grid { grid-template-columns: 1fr; }
      .stat-row { grid-template-columns: 1fr 1fr; }
      .stat:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .photo-card img { height: 150px; }
      .page-nav { grid-template-columns: 82px 1fr 82px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="bookbar">
    <div class="bookbar-title">给小婷的回忆录</div>
    <button class="toc-btn" id="tocButton" type="button">目录</button>
  </header>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

  <main>
    <article class="page-card" id="pageCard" aria-live="polite"></article>
  </main>

  <nav class="page-nav" aria-label="翻页">
    <button id="prevButton" type="button">上一页</button>
    <div class="page-indicator"><b id="pageCounter"></b><span id="pageChapter"></span></div>
    <button id="nextButton" type="button">下一页</button>
  </nav>

  <div class="toc-overlay" id="tocOverlay">
    <section class="toc-panel" aria-label="回忆录目录">
      <div class="toc-head">
        <h2>目录</h2>
        <button class="toc-close" id="tocClose" type="button" aria-label="关闭目录">×</button>
      </div>
      <div class="toc-list" id="tocList"></div>
    </section>
  </div>

  <script>
    const pages = [
      {
        type: "title",
        chapter: "",
        title: "给小婷的回忆录",
        html: `
          <div class="date">2026.06.24 — 10.25</div>
          <h1>给小婷的<br>回忆录</h1>
          <p class="lead">从我认识你的第一句话，写到我们一起见过面以后。</p>
          <p>这里只放我记得的好日子、你说过的话，还有我们认真聊过的以后。</p>
          <p>会有聊天原文，也会有那些你发给我的照片。慢慢翻，不着急。</p>
        `
      },
      {
        chapter: "翻阅说明",
        title: "这本里写了什么",
        html: `
          <p class="lead">不是一份数据报告。是一本很长的回忆录。</p>
          <div class="memory-list">
            <div class="memory-item"><strong>第一幕 · 认识你</strong><p>从第一条消息，到“我们在一起啦”。</p></div>
            <div class="memory-item"><strong>第二幕 · 普通日子</strong><p>吃饭、洗澡、吹头发、睡觉、电话和每天的小事。</p></div>
            <div class="memory-item"><strong>第三幕 · 我们一起喜欢的东西</strong><p>游戏、猫、短剧、照片、裙子和路边的夜宵。</p></div>
            <div class="memory-item"><strong>第四幕 · 甜话</strong><p>你叫我老公，我叫你宝宝，还有那些我舍不得删掉的原话。</p></div>
            <div class="memory-item"><strong>第五幕 · 约定</strong><p>北京、新房、小猫、迪士尼和生日。</p></div>
            <div class="memory-item"><strong>第六幕 · 见面</strong><p>机场、酒店大堂，还有终于看到你的那一刻。</p></div>
          </div>
          <p class="small">可以用下面的按钮翻页，也可以直接打开目录。手机可以左右滑。</p>
          <p>每张聊天截图都来自我们当时的记录，照片也都是聊天里真实发过的。它们和文字放在一起，才是我们过过的日子。</p>
        `
      },
      {
        type: "chapter-page",
        chapter: "第一幕",
        title: "认识你",
        html: `<p>故事最开始，我们只是各自手机里的一个名字。</p>`
      },
      {
        chapter: "第一幕 · 认识你",
        title: "第一句话",
        html: `
          <p class="lead">2026 年 6 月 24 日，抖音里出现了一句：“可以开始聊天了。”</p>
          <div class="stat-row">
            <div class="stat"><strong>6 月 24 日</strong><span>第一次出现在彼此的消息里</span></div>
            <div class="stat"><strong>22 条</strong><span>那天在抖音留下的消息</span></div>
            <div class="stat"><strong>2 条</strong><span>微信里只有刚加上时的系统提示</span></div>
          </div>
          <p>那天你说得很清楚：“微信不聊天，纯扩列。”</p>
          <div class="quote">微信不聊天，纯扩列。<small>小婷 · 2026.06.24</small></div>
          <p>我记住了这句话。因为后来我们聊了那么久，反而显得最开始那句边界特别可爱。</p>
          <p>那天抖音第一条是“可以开始聊天了”，像所有普通网友故事一样平常。我们谁也没说以后会每天打电话，更没想到两个月后会认真聊起住哪里、养什么猫。</p>
          <figure class="chat-shot"><img src="assets/chat-first-douyin.png" alt="6月24日抖音的第一段聊天记录"></figure>
        `
      },
      {
        chapter: "第一幕 · 认识你",
        title: "大美女，怎么啦",
        html: `
          <p class="lead">真正开始聊天，是 7 月 22 日。</p>
          <div class="quote">怎么啦大美女<small>圣杰 · 2026.07.22 13:44</small></div>
          <div class="quote">在骂领导呀。<small>小婷 · 2026.07.22</small></div>
          <p>那天我们一共产下了 140 条消息。从工作、收入、喜欢什么样的人，一直聊到生活里那些细碎的事。</p>
          <p>我当时不知道，这个说在骂领导的女孩，后来会变成我每天最想找的人。</p>
          <p>后来我才慢慢知道，你上班很累，常常遇到让人无语的安排。你跟我讲这些的时候，我一边陪你吐槽，一边记住了你不喜欢什么、累的时候会怎么说。</p>
          <figure class="chat-shot"><img src="assets/chat-first-chat.png" alt="7月22日第一次认真聊天的原始记录"></figure>
        `
      },
      {
        chapter: "第一幕 · 认识你",
        title: "小婷",
        html: `
          <p class="lead">你说：“叫我小婷就行。”</p>
          <p>从那以后，“大美女”是我的玩笑，“小婷”才是我认真叫你的名字。</p>
          <div class="quote">小婷。<small>后来我在心里叫了你很多很多遍</small></div>
          <p>它出现在消息里、电话接通的第一句里，也出现在我不舍得删的聊天记录里。</p>
          <p>一个名字很短，可它把一个人的生活，慢慢放进了另一个人的日常。</p>
          <p>后来我会在早上问“小婷到公司了吗”，晚上说“小婷早点睡”。同一句称呼重复得越多，越像生活里真的有了一个人。</p>
          <figure class="photo-wide photo-card"><img src="assets/photos/bouquet.jpg" alt="一束花"><figcaption>从“大美女”到“小婷”，称呼变了，距离也变了。</figcaption></figure>
        `
      },
      {
        chapter: "第一幕 · 认识你",
        title: "因为是真的喜欢你呀",
        html: `
          <p class="lead">7 月 24 日，我第一次很直白地说喜欢。</p>
          <div class="quote">因为是真的喜欢你呀。<small>圣杰 · 2026.07.24 13:55</small></div>
          <p>不是提前准备好的情话，也不是为了让你快点答应。</p>
          <p>就是聊着聊着，突然发现，你的消息来了我会开心，没来我会一直看手机。那种喜欢，藏不住。</p>
          <p>那天的聊天已经不只是轻松的玩笑。我们开始认真地聊生活、聊怎么相处，也会有一点紧张，怕自己说错话，又忍不住想把真实的喜欢告诉你。</p>
          <figure class="chat-shot"><img src="assets/chat-confession.png" alt="7月24日喜欢你的原始聊天记录"></figure>
        `
      },
      {
        chapter: "第一幕 · 认识你",

    tocButton.addEventListener("click", () => tocOverlay.classList.add("open"));
    tocClose.addEventListener("click", () => tocOverlay.classList.remove("open"));
    tocOverlay.addEventListener("click", (event) => {
      if (event.target === tocOverlay) tocOverlay.classList.remove("open");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") renderPage(currentPage - 1);
      if (event.key === "ArrowRight") renderPage(currentPage + 1);
      if (event.key === "Escape") tocOverlay.classList.remove("open");
    });
    document.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        renderPage(currentPage + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });
    window.addEventListener("hashchange", () => renderPage(readHashPage(), false));

    buildToc();
    renderPage(readHashPage(), false);
  </script>
</body>
</html>
