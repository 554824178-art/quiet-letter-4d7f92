<html lang="zh-CN">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>给小婷的回忆录</title>
  <style>
    :root {
      --paper: #fffaf6;
      --paper-deep: #f5e5e3;
      --ink: #382d31;
      --muted: #78686c;
      --rose: #a84e65;
      --rose-deep: #743446;
      --rose-soft: #eed4d9;
      --sage: #56796f;
      --line: rgba(88, 58, 68, .14);
      --shadow: 0 22px 70px rgba(89, 51, 60, .12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100svh;
      padding: 58px 0 92px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 3%, #f8dde2 0, transparent 27rem),
        radial-gradient(circle at 92% 22%, #f2e3d2 0, transparent 28rem),
        linear-gradient(180deg, #fbf3ef, #fffaf6 52%, #f5ebe7);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .bookbar {
      position: fixed;
      z-index: 30;
      top: 0;
      left: 0;
      right: auto;
      width: 100%;
      height: 54px;
      padding: 0 max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      background: rgba(255, 250, 246, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .bookbar-title {
      min-width: 0;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 16px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toc-btn {
      min-height: 34px;
      border: 1px solid rgba(168, 78, 101, .25);
      border-radius: 999px;
      padding: 5px 12px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      cursor: pointer;
    }
    .progress {
      position: fixed;
      z-index: 31;
      top: 53px;
      left: 0;
      right: auto;
      width: 100%;
      height: 2px;
      background: rgba(168, 78, 101, .08);
    }
    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--rose), #c88591);
      transition: width .3s ease;
    }
    main { width: min(820px, calc(100% - 26px)); margin: 0 auto; }
    .page-card {
      position: relative;
      min-height: calc(100svh - 178px);
      padding: clamp(24px, 6vw, 52px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .88), rgba(255, 249, 245, .82)),
        var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: pageIn .42s ease both;
    }
    .page-card:before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(168, 78, 101, .08);
      border-radius: 19px;
      pointer-events: none;
    }
    .page-card > * { position: relative; z-index: 1; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .chapter {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .46);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2 {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-weight: 550;
      line-height: 1.25;
      letter-spacing: -.025em;
    }
    h1 { margin: 18px 0 24px; font-size: clamp(46px, 12vw, 76px); }
    h2 { margin: 6px 0 22px; font-size: clamp(30px, 7vw, 44px); }
    h3 { margin: 24px 0 8px; font-size: 19px; }
    p { margin: 0 0 1.05em; }
    .lead { color: var(--muted); font-size: clamp(17px, 3.8vw, 20px); line-height: 1.8; }
    .small { color: var(--muted); font-size: 13px; }
    .quote {
      margin: 20px 0;
      padding: 17px 19px;
      border-left: 3px solid var(--rose);
      border-radius: 0 16px 16px 0;
      color: var(--rose-deep);
      background: rgba(255, 250, 247, .8);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 19px;
      line-height: 1.7;
    }
    .quote small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 11px;
      font-style: normal;
      letter-spacing: .04em;
    }
    .quote-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .quote-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255, 255, 255, .62);
    }
    .quote-card time { display: block; color: var(--rose); font-size: 11px; font-weight: 750; margin-bottom: 7px; }
    .quote-card p { margin: 0; font-size: 15px; line-height: 1.72; }
    .bubble {
      width: fit-content;
      max-width: 100%;
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 14px;
    }
    .bubble.them { background: #f1e5e4; color: #49373d; border-top-left-radius: 4px; }
    .bubble.me { margin-left: auto; background: #e2eee8; color: #27443b; border-top-right-radius: 4px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin: 20px 0;
    }
    .stat {
      min-height: 102px;
      padding: 14px 12px;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .58);
    }
    .stat strong {
      display: block;
      margin-bottom: 5px;
      color: var(--rose-deep);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 25px;
      line-height: 1.15;
    }
    .stat span { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .timeline {
      position: relative;
      display: grid;
      gap: 15px;
      margin-top: 20px;
      padding-left: 23px;
    }
    .timeline:before {
      content: "";
      position: absolute;
      left: 5px;
      top: 6px;
      bottom: 5px;
      width: 1px;
      background: var(--rose-soft);
    }
    .timeline-item { position: relative; padding-left: 12px; }
    .timeline-item:before {
      content: "";
      position: absolute;
      left: -20px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 4px rgba(238, 212, 217, .5);
    }
    .timeline-item time { color: var(--rose); font-size: 11px; font-weight: 750; }
    .timeline-item h3 { margin: 3px 0 3px; font-size: 16px; }
    .timeline-item p { margin: 0; color: var(--muted); font-size: 14px; }
    .memory-list { display: grid; gap: 11px; margin-top: 17px; }
    .memory-item {
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .54);
    }
    .memory-item strong { color: var(--rose-deep); }
    .memory-item p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 18px 0 0; }
    .tags span {
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      font-size: 12px;
    }
    .toc-list { display: grid; gap: 8px; margin-top: 20px; }
    .toc-item {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, .56);
      text-align: left;
      cursor: pointer;
    }
    .toc-item b { color: var(--rose); font-size: 12px; }
    .toc-item span { font-size: 14px; line-height: 1.45; }
    .title-page { display: flex; flex-direction: column; justify-content: center; }
    .title-page .date { color: var(--rose); font-size: 13px; font-weight: 750; letter-spacing: .18em; }
    .title-page h1 { margin-top: 22px; }
    .chapter-page { display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .chapter-page .chapter { align-self: center; }
    .chapter-page p { color: var(--muted); }
    .end-page { display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .end-page h1 { font-size: clamp(36px, 9vw, 58px); }
    .page-nav {
      position: fixed;
      z-index: 32;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(520px, calc(100% - 24px));
      min-height: 56px;
      display: grid;
      grid-template-columns: 92px 1fr 92px;
      gap: 8px;
      align-items: center;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      color: #fff;
      background: rgba(54, 41, 46, .9);
      box-shadow: 0 12px 34px rgba(0,0,0,.18);
      backdrop-filter: blur(16px);
    }
    .page-nav button {
      min-height: 40px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(255,255,255,.11);
      cursor: pointer;
    }
    .page-nav button:disabled { opacity: .3; cursor: default; }
    .page-indicator { text-align: center; font-size: 12px; line-height: 1.3; }
    .page-indicator b { display: block; font-size: 14px; }
    .toc-overlay {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: none;
      padding: 70px 14px 90px;
      background: rgba(42, 30, 35, .42);
      backdrop-filter: blur(8px);
    }
    .toc-overlay.open { display: block; }
    .toc-panel {
      width: min(680px, 100%);
      max-height: calc(100svh - 160px);
      margin: 0 auto;
      overflow: auto;
      padding: 22px;
      border-radius: 24px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .toc-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .toc-head h2 { margin: 0; font-size: 27px; }
    .toc-close {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--rose-deep);
      background: rgba(238, 212, 217, .38);
      cursor: pointer;
    }
    .toc-list { max-height: none; }
    @media (max-width: 620px) {
      body { padding-top: 52px; padding-bottom: 82px; font-size: 16px; line-height: 1.8; }
      .bookbar { height: 50px; }
      .progress { top: 49px; }
      main { width: calc(100% - 20px); }
      .page-card { min-height: calc(100svh - 158px); padding: 22px 17px 28px; border-radius: 22px; }
      .page-card:before { inset: 10px; border-radius: 16px; }
      h2 { font-size: 29px; }
      h1 { font-size: 45px; }
      .quote-grid { grid-template-columns: 1fr; }
      .stat-row { grid-template-columns: 1fr 1fr; }
      .stat:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .page-nav { grid-template-columns: 82px 1fr 82px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

    const pageCard = document.getElementById("pageCard");
    const pageCounter = document.getElementById("pageCounter");
    const pageChapter = document.getElementById("pageChapter");
    const progressBar = document.getElementById("progressBar");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const tocButton = document.getElementById("tocButton");
    const tocOverlay = document.getElementById("tocOverlay");
    const tocClose = document.getElementById("tocClose");
    const tocList = document.getElementById("tocList");
    let currentPage = 0;
    let touchStartX = 0;
    let touchStartY = 0;

    function readHashPage() {
      const match = location.hash.match(/page=(\d+)/);
      const value = match ? Number(match[1]) - 1 : 0;
      return Math.min(Math.max(value, 0), pages.length - 1);
    }

    function renderPage(index, updateHash = true) {
      currentPage = Math.min(Math.max(index, 0), pages.length - 1);
      const page = pages[currentPage];
      pageCard.className = `page-card${page.type ? ` ${page.type}` : ""}`;
      pageCard.style.animation = "none";
      pageCard.offsetHeight;
      pageCard.style.animation = "";
      pageCard.innerHTML = `
        ${page.chapter ? `<div class="chapter">${page.chapter}</div>` : ""}
        ${page.type === "title" ? "" : `<h2>${page.title}</h2>`}
        ${page.html}
      `;
      pageCounter.textContent = `${currentPage + 1} / ${pages.length}`;
      pageChapter.textContent = page.chapter || "给小婷的回忆录";
      prevButton.disabled = currentPage === 0;
      nextButton.disabled = currentPage === pages.length - 1;
      progressBar.style.width = `${((currentPage + 1) / pages.length) * 100}%`;
      document.title = `${page.title} · 给小婷的回忆录`;
      if (updateHash) history.replaceState(null, "", `#page=${currentPage + 1}`);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function buildToc() {
      tocList.innerHTML = "";
      pages.forEach((page, index) => {
        if (page.type === "chapter-page") return;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "toc-item";
        button.innerHTML = `<b>${String(index + 1).padStart(2, "0")}</b><span>${page.title}</span>`;
        button.addEventListener("click", () => {
          tocOverlay.classList.remove("open");
          renderPage(index);
        });
        tocList.appendChild(button);
      });
    }

    prevButton.addEventListener("click", () => renderPage(currentPage - 1));
    nextButton.addEventListener("click", () => renderPage(currentPage + 1));
    tocButton.addEventListener("click", () => tocOverlay.classList.add("open"));
    tocClose.addEventListener("click", () => tocOverlay.classList.remove("open"));
    tocOverlay.addEventListener("click", (event) => {
      if (event.target === tocOverlay) tocOverlay.classList.remove("open");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") renderPage(currentPage - 1);
      if (event.key === "ArrowRight") renderPage(currentPage + 1);
      if (event.key === "Escape") tocOverlay.classList.remove("open");
    });
    document.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        renderPage(currentPage + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });
    window.addEventListener("hashchange", () => renderPage(readHashPage(), false));

    buildToc();
    renderPage(readHashPage(), false);
  </script>
