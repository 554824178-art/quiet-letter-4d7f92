<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>回忆录访问记录</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #472e34;
      --muted: #8c7479;
      --accent: #b9526b;
      --line: rgba(118, 80, 89, .16);
      --paper: rgba(255, 252, 249, .92);
      --wash: #f6eeeb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 48px;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 0%, rgba(239, 207, 214, .7), transparent 34rem),
        linear-gradient(160deg, #fbf8f5, #f2e8e5);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { width: min(100%, 760px); margin: 0 auto; }
    .card {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 18px 52px rgba(78, 53, 60, .1);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 6px; font-size: clamp(25px, 7vw, 38px); }
    .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .tools { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    input, button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
    }
    input { flex: 1 1 155px; min-width: 0; padding: 8px 11px; background: #fff; color: var(--ink); }
    button { padding: 8px 16px; color: #fff; background: var(--accent); cursor: pointer; }
    button.secondary { color: var(--accent); background: transparent; }
    .today {
      display: grid;
      grid-template-columns: 1.2fr repeat(4, 1fr);
      gap: 9px;
      margin-top: 18px;
    }
    .metric {
      min-height: 92px;
      padding: 14px 11px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, .62);
    }
    .metric strong { display: block; font-size: 27px; line-height: 1.1; }
    .metric span { display: block; margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .section-title { margin: 24px 0 10px; font-size: 16px; }
    .hourly-list { display: grid; gap: 8px; }
    .hour-row {
      display: grid;
      grid-template-columns: 52px 1fr 28px;
      gap: 9px;
      align-items: center;
      min-height: 28px;
      font-size: 12px;
    }
    .hour-bar { height: 8px; overflow: hidden; border-radius: 999px; background: rgba(185, 82, 107, .1); }
    .hour-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #c26478, #e8a7b4); }
    .hour-row b { text-align: right; font-weight: 500; }
    .empty-hours { padding: 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 12px; text-align: center; }
    .section-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 24px; }
    .section-head h2 { margin: 0; font-size: 16px; }
    .section-head button { min-height: 36px; padding: 6px 12px; }
    .region-list { display: grid; gap: 8px; margin-top: 10px; }
    .region-row {
      display: grid;
      grid-template-columns: 92px 1fr 28px;
      gap: 9px;
      align-items: center;
      min-height: 28px;
      font-size: 12px;
    }
    .region-bar { height: 8px; overflow: hidden; border-radius: 999px; background: rgba(185, 82, 107, .1); }
    .region-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #b55268, #e4a3b2); }
    .region-row b { text-align: right; font-weight: 500; }
    .note { margin: 18px 0 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .updated { margin-top: 12px; color: var(--muted); font-size: 11px; }
    .locked { display: none; }
    .error { margin-top: 12px; color: #a63d50; font-size: 12px; }
    body.locked .app { display: none; }
    body.locked .locked { display: block; }
    @media (max-width: 560px) {
      body { padding: 18px 12px 36px; }
      .card { padding: 18px 14px; border-radius: 18px; }
      .today { grid-template-columns: repeat(2, 1fr); }
      .metric:first-child { grid-column: 1 / -1; }
      .hour-row { grid-template-columns: 45px 1fr 24px; gap: 7px; }
      .region-row { grid-template-columns: 78px 1fr 24px; gap: 7px; }
    }
  </style>
</head>
<body class="locked">
  <main>
    <section class="card locked">
      <h1>访问记录</h1>
      <p class="sub">输入访问码后查看。这个页面不会被搜索引擎收录。</p>
      <div class="tools">
        <input id="accessCode" type="password" autocomplete="off" placeholder="访问码">
        <button id="unlockButton" type="button">查看</button>
      </div>
      <div class="error" id="unlockError"></div>
    </section>

    <section class="card app">
      <h1>回忆录访问记录</h1>
      <p class="sub">只有停留或滑动、点击等真实交互后才会计数；微信预览不会算作打开。</p>
      <div class="tools">
        <input id="reportDate" type="date">
        <button id="refreshButton" type="button">刷新</button>
        <button class="secondary" id="copyButton" type="button">复制统计链接</button>
      </div>
      <div class="today">
        <div class="metric"><strong id="openedCount">–</strong><span>当天真实打开</span></div>
        <div class="metric"><strong id="quarterCount">–</strong><span>看到 25%</span></div>
        <div class="metric"><strong id="halfCount">–</strong><span>看到 50%</span></div>
        <div class="metric"><strong id="threeQuarterCount">–</strong><span>看到 75%</span></div>
        <div class="metric"><strong id="finishCount">–</strong><span>看到最后一页</span></div>
      </div>
      <h2 class="section-title">访问时段</h2>
      <div class="hourly-list" id="hourlyRows"></div>
      <div class="section-head">
        <h2>访问地区</h2>
        <button class="secondary" id="loadRegionsButton" type="button">加载地区</button>
      </div>
      <div class="region-list" id="regionRows">
        <div class="empty-hours">点击“加载地区”查看按省份归类的粗略位置</div>
      </div>
      <p class="note">时间为北京时间，精确到小时。地区只根据访问 IP 粗略识别到省级，不保存完整 IP。统计页验证通过后，当前浏览器会自动排除，不记录你自己的访问。</p>
      <p class="note" id="ownerStatus"></p>
      <div class="updated" id="updatedAt"></div>
    </section>
  </main>
  <script>
    const ACCESS_HASH = "4774ee78afae54049587c87265f76432372c75ab819417d26b1751b63838816e";
    const BASE = "https://abacus.jasoncameron.dev";
    const NAMESPACE = "xiaoting-memoir-b91e6d4c-2f78-4a31";
    const CHINA_REGIONS = {
      BJ: "北京", TJ: "天津", HE: "河北", SX: "山西", NM: "内蒙古",
      LN: "辽宁", JL: "吉林", HL: "黑龙江", SH: "上海", JS: "江苏",
      ZJ: "浙江", AH: "安徽", FJ: "福建", JX: "江西", SD: "山东",
      HA: "河南", HB: "湖北", HN: "湖南", GD: "广东", GX: "广西",
      HI: "海南", CQ: "重庆", SC: "四川", GZ: "贵州", YN: "云南",
      XZ: "西藏", SN: "陕西", GS: "甘肃", QH: "青海", NX: "宁夏",
      XJ: "新疆", TW: "台湾", HK: "香港", MO: "澳门"
    };
    const dateInput = document.getElementById("reportDate");
    const reportEls = {
      visit: document.getElementById("openedCount"),
      m25: document.getElementById("quarterCount"),
      m50: document.getElementById("halfCount"),
      m75: document.getElementById("threeQuarterCount"),
      finish: document.getElementById("finishCount")
    };

    function chinaDateKey(date = new Date()) {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(date).replaceAll("-", "");
    }

    function dateValue(date) {
      return `${date.slice(0, 4)}-${date.slice(4, 6)}-${date.slice(6, 8)}`;
    }

    async function getCount(prefix, dateKey, retry = 0) {
      try {
        const response = await fetch(
          `${BASE}/get/${NAMESPACE}/${encodeURIComponent(`${prefix}-${dateKey}`)}`,
          { cache: "no-store" }
        );
        if (response.status === 429 && retry < 3) {
          await new Promise((resolve) => setTimeout(resolve, 1200 * (retry + 1)));
          return getCount(prefix, dateKey, retry + 1);
        }
        if (!response.ok) return 0;
        const payload = await response.json();
        return Number(payload.value) || 0;
      } catch {
        return 0;
      }
    }

    async function mapLimit(items, limit, worker) {
      const results = new Array(items.length);
      let cursor = 0;
      async function run() {
        while (cursor < items.length) {
          const index = cursor;
          cursor += 1;
          results[index] = await worker(items[index], index);
        }
      }
      await Promise.all(Array.from({ length: Math.min(limit, items.length) }, run));
      return results;
    }

    async function loadDay(dateKey) {
      const hourKeys = Array.from({ length: 24 }, (_, hour) =>
        `${dateKey}${String(hour).padStart(2, "0")}`
      );
      const [hourly, m25, m50, m75, finish] = await Promise.all([
        mapLimit(hourKeys, 4, (hourKey) => getCount("visit", hourKey)),
        getCount("m25", dateKey),
        getCount("m50", dateKey),
        getCount("m75", dateKey),
        getCount("finish", dateKey)
      ]);
      return {
        date: dateKey,
        visit: hourly.reduce((sum, count) => sum + count, 0),
        hourly,
        m25,
        m50,
        m75,
        finish
      };
    }

    async function renderReport() {
      const selected = (dateInput.value || dateValue(chinaDateKey())).replaceAll("-", "");
      const today = await loadDay(selected);
      for (const [prefix, element] of Object.entries(reportEls)) {
        element.textContent = String(today[prefix]);
      }
      const hourly = document.getElementById("hourlyRows");
      const activeHours = today.hourly
        .map((count, hour) => ({ count, hour }))
        .filter((item) => item.count > 0);
      if (!activeHours.length) {
        hourly.innerHTML = '<div class="empty-hours">这个日期暂时还没有访问记录</div>';
      } else {
        const maxCount = Math.max(...activeHours.map((item) => item.count));
        hourly.innerHTML = activeHours.map((item) => `
          <div class="hour-row">
            <span>${String(item.hour).padStart(2, "0")}:00</span>
            <span class="hour-bar"><i style="width:${Math.max(8, item.count / maxCount * 100)}%"></i></span>
            <b>${item.count}</b>
          </div>
        `).join("");
      }
      document.getElementById("updatedAt").textContent =
        `更新于 ${new Date().toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false })}`;
    }

    async function renderRegions() {
      const selected = (dateInput.value || dateValue(chinaDateKey())).replaceAll("-", "");
      const container = document.getElementById("regionRows");
      const button = document.getElementById("loadRegionsButton");
      button.disabled = true;
      button.textContent = "加载中…";
      container.innerHTML = '<div class="empty-hours">正在读取地区统计…</div>';
      const regionEntries = Object.entries(CHINA_REGIONS);
      const counts = await mapLimit(regionEntries, 3, async ([code]) => ({
        name: CHINA_REGIONS[code],
        count: await getCount("geo-CN", `${code}-${selected}`)
      }));
      const other = await getCount("geo-OTHER", `OTHER-${selected}`);
      const unknown = await getCount("geo-UNKNOWN", `UNKNOWN-${selected}`);
      if (other) counts.push({ name: "海外或其他", count: other });
      if (unknown) counts.push({ name: "无法识别", count: unknown });
      const active = counts.filter((item) => item.count > 0).sort((a, b) => b.count - a.count);
      if (!active.length) {
        container.innerHTML = '<div class="empty-hours">这个日期暂时没有可识别的地区记录</div>';
      } else {
        const maxCount = Math.max(...active.map((item) => item.count));
        container.innerHTML = active.map((item) => `
          <div class="region-row">
            <span>${item.name}</span>
            <span class="region-bar"><i style="width:${Math.max(8, item.count / maxCount * 100)}%"></i></span>
            <b>${item.count}</b>
          </div>
        `).join("");
      }
      button.disabled = false;
      button.textContent = "重新加载";
    }

    async function hashAccessCode(code) {
      const bytes = new TextEncoder().encode(code);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    async function unlock(code) {
      if (await hashAccessCode(code) !== ACCESS_HASH) {
        document.getElementById("unlockError").textContent = "访问码不对。";
        return false;
      }
      document.body.classList.remove("locked");
      try {
        localStorage.setItem("memoirAnalyticsOptOut", "true");
        document.getElementById("copyButton").textContent = "复制统计链接";
      } catch {}
      document.getElementById("ownerStatus").textContent =
        "当前浏览器已排除统计，你自己打开回忆录不会被计数。";
      dateInput.value = dateValue(chinaDateKey());
      renderReport();
      setInterval(renderReport, 30000);
      return true;
    }

    document.getElementById("unlockButton").addEventListener("click", async () => {
      const code = document.getElementById("accessCode").value.trim();
      const url = new URL(location.href);
      url.searchParams.set("key", code);
      history.replaceState(null, "", url);
      await unlock(code);
    });

    document.getElementById("refreshButton").addEventListener("click", renderReport);
    dateInput.addEventListener("change", () => {
      document.getElementById("regionRows").innerHTML =
        '<div class="empty-hours">点击“加载地区”查看按省份归类的粗略位置</div>';
      document.getElementById("loadRegionsButton").textContent = "加载地区";
      renderReport();
    });
    document.getElementById("loadRegionsButton").addEventListener("click", renderRegions);
    document.getElementById("copyButton").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        document.getElementById("copyButton").textContent = "已复制";
      } catch {
        document.getElementById("copyButton").textContent = "复制失败";
      }
    });

    const suppliedCode = new URL(location.href).searchParams.get("key") || "";
    if (suppliedCode) {
      document.getElementById("accessCode").value = suppliedCode;
      unlock(suppliedCode);
    }
  </script>
</body>
</html>
